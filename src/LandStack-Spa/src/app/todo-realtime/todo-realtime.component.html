<h1>To Do List</h1>

@if (todos$ | async; as todos) {
  <ul>
    @for (todo of todos; track todo) {
      <li>
        <input
          type="checkbox"
          [checked]="todo.isCompleted"
          (change)="toggleComplete(todo.toDoItemId)"
        />
        <span>{{ todo.description }}</span>
        <button (click)="delete(todo.toDoItemId)">X</button>
      </li>
    }
  </ul>
}

<form [formGroup]="addNewForm" (ngSubmit)="create()">
  <input
    formControlName="description"
    type="text"
    placeholder="Enter To Do Item..."
  />
</form>
